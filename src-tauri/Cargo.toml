[package]
name = "garlic"
version = "0.1.0"
description = "Garlic — личный таск-трекер и заметки в виде графа"
edition = "2021"
publish = false

[lib]
name = "garlic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
thiserror = "2.0.21"
trash = "5.2.9"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
