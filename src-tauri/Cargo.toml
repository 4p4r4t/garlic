[package]
name = "garlic"
version = "0.1.0"
description = "Garlic — личный таск-трекер и заметки в виде графа"
edition = "2021"
publish = false

[lib]
name = "garlic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7"] }
